<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">Charles Quan Tran, AI engineer: measured LLM throughput on one H100</title>
<desc id="d">Line chart of output tokens per second against concurrent requests for Qwen3-8B. FP8 reaches 16,432 and BF16 12,398 tokens per second at 256 concurrent requests.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#59636e;font-size:20px}
.l{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;animation:draw 2.4s cubic-bezier(.6,0,.2,1) backwards}
.e{animation:show .6s ease-out 2.1s backwards}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes show{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<path d="M12 316.1H930" stroke="#d8dee4" stroke-width="1.5"/>
