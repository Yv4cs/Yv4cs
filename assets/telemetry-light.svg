<text class="m" x="708" y="135.3" text-anchor="end">15k</text>
<path d="M12 410H930" stroke="#59636e" stroke-width="1.5"/>
<path d="M12.0 410v8" stroke="#59636e" stroke-width="1.5"/><text class="m" x="12.0" y="444" text-anchor="start">1</text>
<path d="M471.0 410v8" stroke="#59636e" stroke-width="1.5"/><text class="m" x="471.0" y="444" text-anchor="middle">16</text>
<path d="M700.5 410v8" stroke="#59636e" stroke-width="1.5"/><text class="m" x="700.5" y="444" text-anchor="middle">64</text>
<path d="M930.0 410v8" stroke="#59636e" stroke-width="1.5"/><text class="m" x="930.0" y="444" text-anchor="middle">256</text>
<text class="m" x="12" y="484">output tokens/s vs concurrent requests (log scale)</text>
<text x="8" y="92" font-size="76" font-weight="700" letter-spacing="-2">Charles Quan Tran</text>
